name: One-shot supplemental data and CAP-04 integration

on:
  push:
    branches:
      - refactor/unify-multifield-and-panel-lifecycle
    paths:
      - .github/workflows/one-shot-combined-dev.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/unify-multifield-and-panel-lifecycle
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Wire implementation and refine CAP-04 selector
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected snippet not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Install CAP-04 after numerical.py has been imported, preserving all manual-K behavior.
          replace(
              'src/treepolo_mlb_data/analysis/__init__.py',
              'from .semantics import SemanticRegistry, default_registry\n',
              'from .semantics import SemanticRegistry, default_registry\nfrom .auto_cluster import install_auto_cluster\n',
          )
          replace(
              'src/treepolo_mlb_data/analysis/__init__.py',
              '\n__all__ = [\n',
              '\ninstall_auto_cluster()\n\n__all__ = [\n',
          )

          # Supplemental data lives beside, but outside, the existing Statcast analysis path.
          replace(
              'src/treepolo_mlb_data/webapp.py',
              '    def data_action(self, action: str, payload: dict[str, Any]) -> Any:\n        if action == "status":\n            return self.status()\n        with self.sync_lock:\n',
              '    def data_action(self, action: str, payload: dict[str, Any]) -> Any:\n        if action == "status":\n            return self.status()\n        if action.startswith("supplemental-"):\n            from .supplemental_data import handle_supplemental_action\n            return handle_supplemental_action(self.config, action, payload)\n        with self.sync_lock:\n',
          )

          replace(
              'src/treepolo_mlb_data/web_static/fast-status.js',
              '    await loadScriptOnce("/navigation-routes.js", "navigationRoutes");\n\n    await waitForFieldCatalog();\n',
              '    await loadScriptOnce("/navigation-routes.js", "navigationRoutes");\n    await loadScriptOnce("/supplemental-data.js", "supplementalData");\n    await loadScriptOnce("/cap04-auto-cluster.js", "cap04AutoCluster");\n\n    await waitForFieldCatalog();\n',
          )

          # Pitch3D MLB/MiLB share one physical table and therefore one source-column map.
          path = Path('src/treepolo_mlb_data/supplemental_data.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '    def _column_map(self, source: str, dataset: str) -> dict[str, str]:\n        return {\n            str(row[0]): str(row[1])\n            for row in self.conn.execute(\n                "SELECT original_name,column_name FROM supplemental_schema WHERE source=? AND dataset=?",\n                (source, dataset),\n            )\n        }\n',
              '    @staticmethod\n    def _schema_dataset(source: str, dataset: str) -> str:\n        return "__shared__" if source == "pitch3d" else dataset\n\n    def _column_map(self, source: str, dataset: str) -> dict[str, str]:\n        schema_dataset = self._schema_dataset(source, dataset)\n        return {\n            str(row[0]): str(row[1])\n            for row in self.conn.execute(\n                "SELECT original_name,column_name FROM supplemental_schema WHERE source=? AND dataset=?",\n                (source, schema_dataset),\n            )\n        }\n',
              1,
          )
          text = text.replace(
              '        mapping = self._column_map(source, dataset)\n        table_columns = {str(row[1]) for row in self.conn.execute(f"PRAGMA table_info({_quote(table)})")}\n',
              '        schema_dataset = self._schema_dataset(source, dataset)\n        mapping = self._column_map(source, dataset)\n        table_columns = {str(row[1]) for row in self.conn.execute(f"PRAGMA table_info({_quote(table)})")}\n',
              1,
          )
          text = text.replace(
              '(now, source, dataset, original),\n',
              '(now, source, schema_dataset, original),\n',
              1,
          )
          text = text.replace(
              '(source, dataset, original, candidate, sql_type, now, now),\n',
              '(source, schema_dataset, original, candidate, sql_type, now, now),\n',
              1,
          )
          path.write_text(text, encoding='utf-8')

          # K-means model selection: spherical-Gaussian BIC proxy makes K=1 a legitimate candidate.
          path = Path('src/treepolo_mlb_data/analysis/auto_cluster.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('def _fit_candidate(')
          end = text.index('\n\ndef _choose_k', start)
          replacement = '''def _fit_candidate(matrix: Any, method: str, k: int, seed: int) -> tuple[Any, Any, Any, float]:
              if method == "kmeans":
                  if k == 1:
                      labels = n.np.zeros(len(matrix), dtype=int)
                      centers = n.np.mean(matrix, axis=0, keepdims=True)
                  else:
                      model = n.KMeans(n_clusters=k, random_state=seed, n_init=10)
                      labels = model.fit_predict(matrix)
                      centers = model.cluster_centers_
                  selector = n.GaussianMixture(
                      n_components=k, covariance_type="spherical", random_state=seed, n_init=3
                  )
                  selector.fit(matrix)
                  return labels, centers, None, float(selector.bic(matrix))
              if method == "gmm":
                  if len(matrix) < 2 and k == 1:
                      labels = n.np.zeros(len(matrix), dtype=int)
                      centers = n.np.mean(matrix, axis=0, keepdims=True)
                      return labels, centers, n.np.ones(len(matrix), dtype=float), 0.0
                  model = n.GaussianMixture(n_components=k, random_state=seed, n_init=3)
                  labels = model.fit_predict(matrix)
                  probabilities = n.np.max(model.predict_proba(matrix), axis=1)
                  return labels, model.means_, probabilities, float(model.bic(matrix))
              raise ValueError(f"unsupported clustering method: {method}")
          '''
          # Dedent because triple-quoted replacement is embedded inside workflow Python.
          import textwrap
          text = text[:start] + textwrap.dedent(replacement) + text[end:]
          text = text.replace('"criterion": "BIC" if spec.method == "gmm" else "K-means spherical BIC",', '"criterion": "BIC" if spec.method == "gmm" else "Spherical-Gaussian BIC (K-means selector)",')
          text = text.replace('"selection_criterion": "BIC" if spec.method == "gmm" else "K-means spherical BIC",', '"selection_criterion": "BIC" if spec.method == "gmm" else "Spherical-Gaussian BIC (K-means selector)",')
          text = text.replace('"complete_rows": len(complete_assignment_rows),\n', '"complete_rows": len(complete_assignment_rows),\n            "excluded_rows": max(0, len(table.rows) - len(complete_assignment_rows)),\n', 1)
          path.write_text(text, encoding='utf-8')

          # Match persistent tests/UI wording to the refined selector name.
          replace(
              'tests/test_cap04_auto_cluster.py',
              'assert rows[0]["criterion"] == "K-means spherical BIC"',
              'assert rows[0]["criterion"] == "Spherical-Gaussian BIC (K-means selector)"',
          )
          replace(
              'src/treepolo_mlb_data/web_static/cap04-auto-cluster.js',
              'const criterion = method?.value === "gmm" ? "BIC" : "K-means spherical BIC";',
              'const criterion = method?.value === "gmm" ? "BIC" : "Spherical-Gaussian BIC（K-means 選模）";',
          )
          PY
      - name: Run persistent tests
        run: pytest -q -m 'not integration'
      - name: Run live Savant integration suite
        run: pytest -q -m integration
      - name: Natural CAP-04 acceptance — Scherzer 2024 cutter plus slider
        shell: bash
        run: |
          python - <<'PY'
          import csv, io, json, requests
          from treepolo_mlb_data.analysis import ClusteringSpec, NumericalExecutor, NumericalTable
          from treepolo_mlb_data.analysis.model import Grain

          url = (
              'https://baseballsavant.mlb.com/statcast_search/csv?all=true&hfPT=&hfAB=&hfBBT=&hfPR=&hfZ=&stadium='
              '&hfBBL=&hfNewZones=&hfGT=R%7C=&hfSea=&hfSit=&player_type=pitcher&hfOuts=&opponent='
              '&pitcher_throws=&batter_stands=&hfSA=&game_date_gt=2024-01-01&game_date_lt=2024-12-31'
              '&pitchers_lookup%5B%5D=453286&team=&position=&hfRO=&home_road=&hfFlag=&metric_1=&hfInn='
              '&min_pitches=0&min_results=0&group_by=name&sort_col=pitches&player_event_sort=h_launch_speed'
              '&sort_order=desc&min_abs=0&type=details&'
          )
          response = requests.get(url, timeout=120, headers={'User-Agent':'treepolo-cap04-acceptance/1.0'})
          response.raise_for_status()
          source_rows = list(csv.DictReader(io.StringIO(response.content.decode('utf-8-sig'))))
          filtered = []
          counts = {'FC':0, 'SL':0}
          for index, row in enumerate(source_rows):
              pitch_type = row.get('pitch_type')
              if pitch_type not in counts:
                  continue
              try:
                  values = [float(row[field]) for field in ('release_speed','pfx_x','pfx_z','release_spin_rate')]
              except (TypeError, ValueError):
                  continue
              counts[pitch_type] += 1
              filtered.append({
                  'pitch_uid': f"{row.get('game_pk')}:{row.get('at_bat_number')}:{row.get('pitch_number')}:{index}",
                  'release_speed': values[0], 'pfx_x': values[1], 'pfx_z': values[2], 'release_spin_rate': values[3],
              })
          if min(counts.values()) < 20 or len(filtered) < 150:
              raise SystemExit(f'Unexpected Scherzer 2024 sample: {counts}, complete={len(filtered)}')
          table = NumericalTable(
              ('pitch_uid','release_speed','pfx_x','pfx_z','release_spin_rate'),
              tuple(filtered), Grain(('pitch_uid',),'pitch')
          )
          result = NumericalExecutor().clustering(table, ClusteringSpec(
              features=('release_speed','pfx_x','pfx_z','release_spin_rate'), method='kmeans', clusters=0,
              standardize=True, seed=42, assignment_limit=0,
          ))
          diag = next(section for section in result['sections'] if section['title'].startswith('自動群數診斷'))
          report = {
              'pitch_labels': counts,
              'complete_rows': len(filtered),
              'selected_k': result['numerical']['selected_clusters'],
              'criterion': result['numerical']['selection_criterion'],
              'candidates': diag['rows'],
          }
          print('===== CAP-04 SCHERZER 2024 FC+SL NATURAL ACCEPTANCE =====')
          print(json.dumps(report, ensure_ascii=False, indent=2))
          if not any(row['candidate_k'] == 1 and row['valid'] for row in diag['rows']):
              raise SystemExit('K=1 was not a valid candidate')
          if not any(row['selected'] and row['valid'] for row in diag['rows']):
              raise SystemExit('No valid selected K')
          PY
      - name: Commit integrated implementation and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-combined-dev.yml
          git add src/treepolo_mlb_data tests
          git commit -m "Integrate supplemental Savant data and CAP-04 Auto K"
          git push origin HEAD:refactor/unify-multifield-and-panel-lifecycle
