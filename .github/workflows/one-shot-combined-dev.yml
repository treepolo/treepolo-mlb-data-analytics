name: One-shot supplemental data and CAP-04 integration

on:
  push:
    branches: [refactor/unify-multifield-and-panel-lifecycle]
    paths: [.github/workflows/one-shot-combined-dev.yml]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/unify-multifield-and-panel-lifecycle
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final implementation patches
        run: |
          python .github/finalize_cap04.py
          python .github/fix_spin_slug.py
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Synthetic CAP-04 acceptance
        shell: bash
        run: |
          python - <<'PY'
          import json
          import numpy as np
          from treepolo_mlb_data.analysis import ClusteringSpec, NumericalExecutor, NumericalTable
          from treepolo_mlb_data.analysis.model import Grain
          def solve(matrix):
              rows=tuple({'pitch_uid':str(i),'x':float(v[0]),'y':float(v[1])} for i,v in enumerate(matrix))
              table=NumericalTable(('pitch_uid','x','y'),rows,Grain(('pitch_uid',),'pitch'))
              out=NumericalExecutor().clustering(table,ClusteringSpec(features=('x','y'),method='kmeans',clusters=0,seed=42,assignment_limit=0))
              diag=next(s for s in out['sections'] if s['title'].startswith('自動群數診斷'))
              return out['numerical']['selected_clusters'], [{'k':r['candidate_k'],'score':r['score'],'valid':r['valid'],'sizes':r['cluster_sizes']} for r in diag['rows']]
          rng=np.random.default_rng(20260831); one=rng.normal(0,1,size=(500,2))
          rng=np.random.default_rng(7); two=np.vstack([rng.normal((-4.5,0),(0.45,0.45),size=(220,2)),rng.normal((4.5,0),(0.45,0.45),size=(220,2))])
          k1,d1=solve(one); k2,d2=solve(two)
          print('===== SYNTHETIC CAP-04 ====='); print(json.dumps({'one_cluster':{'selected_k':k1,'candidates':d1},'two_clusters':{'selected_k':k2,'candidates':d2}},indent=2))
          if (k1,k2)!=(1,2): raise SystemExit(f'Auto K synthetic failure: {(k1,k2)}')
          PY
      - name: Run full persistent suite
        run: pytest -q -m 'not integration'
      - name: Run live Savant integration suite
        run: pytest -q -m integration
      - name: Live supplemental-source acceptance
        shell: bash
        run: |
          python - <<'PY'
          import csv,io,json,tempfile
          from treepolo_mlb_data.config import AppConfig
          from treepolo_mlb_data.supplemental_data import SupplementalClient, handle_supplemental_action
          with tempfile.TemporaryDirectory() as td:
              cfg=AppConfig(data_dir=td,request_timeout_seconds=120,request_retries=1,request_backoff_seconds=.5,request_pause_seconds=0)
              client=SupplementalClient(cfg); report={}
              for dataset in ('mlb','milb'):
                  resp=client.pitch3d(660271,dataset); rows=list(csv.DictReader(io.StringIO(resp.content.decode('utf-8-sig')))); fields=set(rows[0]) if rows else set(); required={'game_pk','play_id','pitcher'}
                  if rows and not required.issubset(fields): raise SystemExit(f'Pitch3D {dataset} missing {required-fields}')
                  report[f'pitch3d_{dataset}']={'rows':len(rows),'columns':len(fields),'required_fields_ok':required.issubset(fields) if rows else None}
              spin=handle_supplemental_action(cfg,'supplemental-run',{'source':'spin_aggregate','dataset':'mlb','mode':'update','pitcher_ids':[660271],'fail_fast':True})
              if spin['status']!='success' or spin['rows_received']<1: raise SystemExit(f'spin aggregate failed: {spin}')
              report['spin_aggregate']={'rows':spin['rows_received'],'status':spin['status']}
              verify=handle_supplemental_action(cfg,'supplemental-verify',{'source':'spin_aggregate','dataset':'mlb'})
              if not verify['ok']: raise SystemExit(f'spin verify failed: {verify}')
              print('===== LIVE SUPPLEMENTAL SOURCE ACCEPTANCE ====='); print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Natural CAP-04 acceptance — Scherzer 2024 FC plus SL
        shell: bash
        run: |
          python - <<'PY'
          import csv,io,json,requests
          from treepolo_mlb_data.analysis import ClusteringSpec,NumericalExecutor,NumericalTable
          from treepolo_mlb_data.analysis.model import Grain
          url=('https://baseballsavant.mlb.com/statcast_search/csv?all=true&hfGT=R%7C=&player_type=pitcher&game_date_gt=2024-01-01&game_date_lt=2024-12-31&pitchers_lookup%5B%5D=453286&min_pitches=0&min_results=0&group_by=name&type=details&')
          r=requests.get(url,timeout=120,headers={'User-Agent':'treepolo-cap04-acceptance/1.0'}); r.raise_for_status(); source=list(csv.DictReader(io.StringIO(r.content.decode('utf-8-sig'))))
          counts={'FC':0,'SL':0}; rows=[]
          for i,row in enumerate(source):
              pt=row.get('pitch_type')
              if pt not in counts: continue
              try: vals=[float(row[f]) for f in ('release_speed','pfx_x','pfx_z','release_spin_rate')]
              except (TypeError,ValueError): continue
              counts[pt]+=1; rows.append({'pitch_uid':f"{row.get('game_pk')}:{row.get('at_bat_number')}:{row.get('pitch_number')}:{i}",'release_speed':vals[0],'pfx_x':vals[1],'pfx_z':vals[2],'release_spin_rate':vals[3]})
          if min(counts.values())<20 or len(rows)<150: raise SystemExit(f'Unexpected Scherzer sample {counts} rows={len(rows)}')
          table=NumericalTable(('pitch_uid','release_speed','pfx_x','pfx_z','release_spin_rate'),tuple(rows),Grain(('pitch_uid',),'pitch')); report={'statcast_labels':counts,'complete_rows':len(rows),'models':{}}
          for method in ('kmeans','gmm'):
              out=NumericalExecutor().clustering(table,ClusteringSpec(features=('release_speed','pfx_x','pfx_z','release_spin_rate'),method=method,clusters=0,standardize=True,seed=42,assignment_limit=0)); diag=next(s for s in out['sections'] if s['title'].startswith('自動群數診斷'))
              candidates=[{'k':x['candidate_k'],'score':x['score'],'valid':x['valid'],'selected':x['selected'],'sizes':x['cluster_sizes'],'reason':x['rejection_reason']} for x in diag['rows']]
              if not any(x['k']==1 and x['valid'] for x in candidates) or not any(x['selected'] and x['valid'] for x in candidates): raise SystemExit(f'{method} invalid diagnostics')
              report['models'][method]={'selected_k':out['numerical']['selected_clusters'],'criterion':out['numerical']['selection_criterion'],'candidates':candidates}
          print('===== SCHERZER 2024 FC+SL NATURAL CAP-04 ====='); print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Commit final integrated implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-combined-dev.yml .github/workflows/spin-probe.yml .github/finalize_cap04.py .github/fix_spin_slug.py
          git add src/treepolo_mlb_data tests
          git commit -m "Integrate supplemental Savant data and CAP-04 Auto K"
          git push origin HEAD:refactor/unify-multifield-and-panel-lifecycle
