name: One-shot supplemental data and CAP-04 integration

# Temporary integration harness; deletes itself after all acceptance checks pass.
on:
  push:
    branches:
      - refactor/unify-multifield-and-panel-lifecycle
    paths:
      - .github/workflows/one-shot-combined-dev.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/unify-multifield-and-panel-lifecycle
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final integration patch
        run: python .github/finalize_cap04.py
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Synthetic CAP-04 diagnostics
        shell: bash
        run: |
          python - <<'PY'
          import json
          import numpy as np
          from treepolo_mlb_data.analysis import ClusteringSpec, NumericalExecutor, NumericalTable
          from treepolo_mlb_data.analysis.model import Grain

          def run(matrix):
              rows=tuple({'pitch_uid':str(i),'x':float(v[0]),'y':float(v[1])} for i,v in enumerate(matrix))
              table=NumericalTable(('pitch_uid','x','y'),rows,Grain(('pitch_uid',),'pitch'))
              result=NumericalExecutor().clustering(table,ClusteringSpec(features=('x','y'),method='kmeans',clusters=0,seed=42,assignment_limit=0))
              diag=next(s for s in result['sections'] if s['title'].startswith('自動群數診斷'))
              return {'selected':result['numerical']['selected_clusters'],'candidates':diag['rows']}
          rng=np.random.default_rng(20260831)
          one=rng.normal(0,1,size=(500,2))
          rng=np.random.default_rng(7)
          two=np.vstack([rng.normal((-4.5,0),(0.45,0.45),size=(220,2)),rng.normal((4.5,0),(0.45,0.45),size=(220,2))])
          report={'one_cluster':run(one),'two_clusters':run(two)}
          print('===== SYNTHETIC CAP-04 DIAGNOSTICS =====')
          print(json.dumps(report,indent=2))
          if report['one_cluster']['selected'] != 1 or report['two_clusters']['selected'] != 2:
              raise SystemExit('synthetic Auto K acceptance failed')
          PY
      - name: Run persistent tests
        run: pytest -q -m 'not integration'
      - name: Run live Savant integration suite
        run: pytest -q -m integration
      - name: Live supplemental-source smoke
        shell: bash
        run: |
          python - <<'PY'
          import csv, io, json, tempfile
          from treepolo_mlb_data.config import AppConfig
          from treepolo_mlb_data.supplemental_data import SupplementalClient, handle_supplemental_action

          with tempfile.TemporaryDirectory() as td:
              cfg=AppConfig(data_dir=td,request_timeout_seconds=120,request_retries=1,request_backoff_seconds=0.5,request_pause_seconds=0)
              client=SupplementalClient(cfg)
              source_report={}
              for dataset in ('mlb','milb'):
                  response=client.pitch3d(660271,dataset)
                  rows=list(csv.DictReader(io.StringIO(response.content.decode('utf-8-sig'))))
                  fields=set(rows[0].keys()) if rows else set()
                  required={'game_pk','play_id','pitcher'}
                  if rows and not required.issubset(fields):
                      raise SystemExit(f'Pitch3D {dataset} missing required fields: {required-fields}')
                  source_report[f'pitch3d_{dataset}']={'rows':len(rows),'columns':len(fields),'has_required_fields':required.issubset(fields) if rows else None}
              spin=handle_supplemental_action(cfg,'supplemental-run',{'source':'spin_aggregate','dataset':'mlb','mode':'update','pitcher_ids':[660271]})
              if spin.get('status') != 'success' or int(spin.get('rows_received') or 0) < 1:
                  raise SystemExit(f'live spin aggregate smoke failed: {spin}')
              source_report['spin_aggregate']={'rows':spin['rows_received'],'status':spin['status']}
              print('===== LIVE SUPPLEMENTAL SOURCE SMOKE =====')
              print(json.dumps(source_report,ensure_ascii=False,indent=2))
          PY
      - name: Natural CAP-04 acceptance — Scherzer 2024 cutter plus slider
        shell: bash
        run: |
          python - <<'PY'
          import csv, io, json, requests
          from treepolo_mlb_data.analysis import ClusteringSpec, NumericalExecutor, NumericalTable
          from treepolo_mlb_data.analysis.model import Grain

          url=(
              'https://baseballsavant.mlb.com/statcast_search/csv?all=true&hfPT=&hfAB=&hfBBT=&hfPR=&hfZ=&stadium='
              '&hfBBL=&hfNewZones=&hfGT=R%7C=&hfSea=&hfSit=&player_type=pitcher&hfOuts=&opponent='
              '&pitcher_throws=&batter_stands=&hfSA=&game_date_gt=2024-01-01&game_date_lt=2024-12-31'
              '&pitchers_lookup%5B%5D=453286&team=&position=&hfRO=&home_road=&hfFlag=&metric_1=&hfInn='
              '&min_pitches=0&min_results=0&group_by=name&sort_col=pitches&player_event_sort=h_launch_speed'
              '&sort_order=desc&min_abs=0&type=details&'
          )
          response=requests.get(url,timeout=120,headers={'User-Agent':'treepolo-cap04-acceptance/1.0'})
          response.raise_for_status()
          source_rows=list(csv.DictReader(io.StringIO(response.content.decode('utf-8-sig'))))
          filtered=[]
          counts={'FC':0,'SL':0}
          for index,row in enumerate(source_rows):
              pt=row.get('pitch_type')
              if pt not in counts: continue
              try: values=[float(row[f]) for f in ('release_speed','pfx_x','pfx_z','release_spin_rate')]
              except (TypeError,ValueError): continue
              counts[pt]+=1
              filtered.append({'pitch_uid':f"{row.get('game_pk')}:{row.get('at_bat_number')}:{row.get('pitch_number')}:{index}",'release_speed':values[0],'pfx_x':values[1],'pfx_z':values[2],'release_spin_rate':values[3]})
          if min(counts.values()) < 20 or len(filtered) < 150:
              raise SystemExit(f'Unexpected Scherzer 2024 sample: {counts}, complete={len(filtered)}')
          table=NumericalTable(('pitch_uid','release_speed','pfx_x','pfx_z','release_spin_rate'),tuple(filtered),Grain(('pitch_uid',),'pitch'))
          report={'pitch_labels':counts,'complete_rows':len(filtered),'models':{}}
          for method in ('kmeans','gmm'):
              result=NumericalExecutor().clustering(table,ClusteringSpec(features=('release_speed','pfx_x','pfx_z','release_spin_rate'),method=method,clusters=0,standardize=True,seed=42,assignment_limit=0))
              diag=next(s for s in result['sections'] if s['title'].startswith('自動群數診斷'))
              if not any(r['candidate_k']==1 and r['valid'] for r in diag['rows']): raise SystemExit(f'{method}: K=1 invalid')
              if not any(r['selected'] and r['valid'] for r in diag['rows']): raise SystemExit(f'{method}: no valid selected K')
              report['models'][method]={'selected_k':result['numerical']['selected_clusters'],'criterion':result['numerical']['selection_criterion'],'candidates':diag['rows']}
          print('===== CAP-04 SCHERZER 2024 FC+SL NATURAL ACCEPTANCE =====')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Commit integrated implementation and remove temporary integration files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-combined-dev.yml .github/finalize_cap04.py
          git add src/treepolo_mlb_data tests
          git commit -m "Integrate supplemental Savant data and CAP-04 Auto K"
          git push origin HEAD:refactor/unify-multifield-and-panel-lifecycle
