name: CPBL Stage 7 Tail Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - feature/cpbl-dataset
    paths:
      - .github/workflows/cpbl-stage7-tail-diagnostic.yml
      - scripts/cpbl_stage7_acceptance_runner.py
      - scripts/cpbl_stage7_e2e_runner.py

jobs:
  performance:
    name: Diagnose 7F performance/cache
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Download known-good full-data artifact
        uses: actions/download-artifact@v4
        with:
          name: cpbl-stage7-7d
          path: stage7_work
          repository: treepolo/treepolo-mlb-data-analytics
          run-id: 34882426283
          github-token: ${{ github.token }}
      - run: python scripts/cpbl_stage7_engineering.py performance --root stage7_work
      - name: Upload 7F diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpbl-stage7-tail-7f
          retention-days: 2
          compression-level: 6
          path: |
            stage7_work/data
            stage7_work/reports

  backend:
    name: Diagnose 7G ten real-data questions
    needs: performance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - uses: actions/download-artifact@v4
        with:
          name: cpbl-stage7-tail-7f
          path: stage7_work
      - run: python scripts/cpbl_stage7_acceptance_runner.py --root stage7_work
      - name: Upload 7G backend diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpbl-stage7-tail-7g-backend
          retention-days: 2
          compression-level: 6
          path: |
            stage7_work/data
            stage7_work/reports

  browser:
    name: Diagnose 7G browser E2E
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' playwright
      - run: python -m playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: cpbl-stage7-tail-7g-backend
          path: stage7_work
      - run: python scripts/cpbl_stage7_e2e_runner.py --root stage7_work
      - name: Upload browser diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpbl-stage7-tail-7g-e2e
          retention-days: 2
          path: stage7_work/reports
