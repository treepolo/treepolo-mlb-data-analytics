name: CI
# Keep final branch validation available on push, pull request, and manual dispatch.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: node --check src/treepolo_mlb_data/web_static/stage4d-visualization.js
      - run: node --check src/treepolo_mlb_data/web_static/stage4d-visualization-fixes.js
      - run: node --check src/treepolo_mlb_data/web_static/stage4d-preset-state-reset.js
      - run: node --check src/treepolo_mlb_data/web_static/font-minimum-compat.js
      - run: node --check src/treepolo_mlb_data/web_static/stage4d-layout-containment.js
      - run: node --check src/treepolo_mlb_data/web_static/stage4d-save-lifecycle.js
      - run: node --check src/treepolo_mlb_data/web_static/stage4d-axis-layout.js
      - run: pytest -q -m 'not integration'

  live-savant-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q -m integration
