name: Temporary Savant spin payload probe
on:
  push:
    branches: [refactor/unify-multifield-and-panel-lifecycle]
    paths: [.github/workflows/spin-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests
      - name: Probe raw player and leaderboard payloads
        shell: bash
        run: |
          python - <<'PY'
          import json,re,requests
          s=requests.Session(); s.headers['User-Agent']='treepolo-spin-probe/1.0'
          urls=[
            'https://baseballsavant.mlb.com/savant-player/660271?playerType=pitcher',
            'https://baseballsavant.mlb.com/savant-player/shohei-ohtani-660271?playerType=pitcher',
            'https://baseballsavant.mlb.com/leaderboard/spin-direction-pitches?year=2026&pitch_type=ALL&playerName=Shohei%20Ohtani&min=0',
            'https://baseballsavant.mlb.com/leaderboard/spin-direction-pitches?year=2026&pitch_type=FF&playerName=Shohei%20Ohtani&min=0&csv=true',
          ]
          needles=['serverVals','spinAxis','image_spin_x','image_spin_y','image_spin_z','image_orientation_angle','hawkeye_measured','alan_active_spin_pct','movement_inferred']
          for url in urls:
            r=s.get(url,timeout=60); print('\n===== URL',url,'STATUS',r.status_code,'TYPE',r.headers.get('content-type'),'BYTES',len(r.content),'=====')
            text=r.text
            for needle in needles:
              idx=text.find(needle)
              print('NEEDLE',needle,'INDEX',idx)
              if idx>=0:
                lo=max(0,idx-500); hi=min(len(text),idx+2500)
                print('SNIPPET',text[lo:hi].replace('\n',' ')[:3000])
            for pat in [r'https?://[^\"\' ]+',r'/[^\"\' ]*(?:spin|axis|orientation)[^\"\' ]*']:
              vals=[]
              for m in re.finditer(pat,text,re.I):
                v=m.group(0)
                if v not in vals: vals.append(v)
                if len(vals)>=30: break
              print('PATHS',pat,vals)
          PY
